<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher — 404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface-2: #f0f1f7;
    --border: #e5e7f0;
    --text-primary: #15172a;
    --text-secondary: #6c7086;
    --text-muted: #9a9db0;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eeecfd;
    --accent-text: #4338ca;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    font-family: var(--font-ui);
    color: var(--text-primary);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  #card{
    width:100%; max-width: 460px;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 1px 2px rgba(20,20,43,0.04), 0 16px 40px rgba(20,20,43,0.08);
    border: 1px solid var(--border);
    padding: 48px 36px;
    text-align: center;
  }

  .brand-mark{
    width:52px; height:52px; border-radius: 15px;
    background: linear-gradient(160deg, var(--accent), #7c3aed);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 28px;
  }
  .brand-mark svg{ width:26px; height:26px; }

  .code{
    font-size: 13px; font-weight:600; letter-spacing: 0.14em;
    color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;
    font-family: var(--font-mono);
  }

  h1{
    font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
    margin: 0 0 10px; color: var(--text-primary);
  }

  h2{
    font-size: 16px; font-weight: 500; color: var(--text-secondary);
    margin: 0 0 34px;
  }

  a.home-link{
    display:inline-flex; align-items:center; gap:8px;
    font-size: 15px; font-weight: 700; color: var(--accent-text);
    text-decoration: none; padding: 12px 22px;
    background: var(--accent-soft); border-radius: 12px;
    transition: background 0.15s, transform 0.05s;
  }
  a.home-link:hover{ background: var(--accent); color: #fff; }
  a.home-link:active{ transform: scale(0.98); }
  a.home-link svg{ width:16px; height:16px; flex-shrink:0; }

  .footnote{
    margin-top: 26px; font-size: 11.5px; color: var(--text-muted);
  }
</style>
</head>
<body>

  <div id="card">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    </div>

    <div class="code">Error</div>
    <h1>Error 404</h1>
    <h2>Page not found</h2>

    <a class="home-link" href="https://lionninjaplays.github.io/cipher/cipher.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Cipher Home
    </a>

    <div class="footnote">This page doesn't exist or has moved.</div>
  </div>

</body>
</html>
